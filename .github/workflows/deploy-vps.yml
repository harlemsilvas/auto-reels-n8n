name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      deploy_dashboard:
        description: "Publicar dashboard"
        required: true
        type: boolean
        default: true
      restart_backend:
        description: "Reiniciar backend PM2"
        required: true
        type: boolean
        default: false
      run_migrations:
        description: "Executar migrations selecionadas"
        required: true
        type: boolean
        default: false
      migration_set:
        description: "Migrations"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "009"
          - "010"
          - "009_010"
          - "011"
          - "013"
          - "014"
          - "015"
          - "016"
          - "017"
          - "010_011"
          - "009_010_011"

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy controlado na VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Executar deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR="/home/socialbot/apps/auto-reels-n8n"
            DEPLOY_DASHBOARD="${{ inputs.deploy_dashboard }}"
            RESTART_BACKEND="${{ inputs.restart_backend }}"
            RUN_MIGRATIONS="${{ inputs.run_migrations }}"
            MIGRATION_SET="${{ inputs.migration_set }}"

            log() {
              echo "[deploy-vps] $*"
            }

            run_migration() {
              local file="$1"
              local verify_file="$2"

              log "Aplicando migration: $file"
              if [[ "$file" == "sql/016-privacy-deletion-requests.sql" || "$file" == "sql/017-privacy-scope-executor.sql" ]]; then
                { sed '/^COMMIT;$/d' "$file"; cat "$verify_file"; printf 'COMMIT;\n'; } \
                  | docker exec -i socialbot_postgres psql -U n8n -d n8n
                return
              fi
              docker exec -i socialbot_postgres psql -U n8n -d n8n < "$file"

              log "Validando migration: $verify_file"
              docker exec -i socialbot_postgres psql -U n8n -d n8n < "$verify_file"
            }

            log "Entrando no projeto"
            cd "$APP_DIR"

            log "Estado antes do pull"
            git status --short
            git rev-parse --short HEAD

            if [[ "$RESTART_BACKEND" == "true" ]]; then
              log "Backup protegido da release, dependencias e configuracao"
              umask 077
              RELEASE_BACKUP="$HOME/backups/inbox-images-pre-deploy-$(date -u +%Y%m%dT%H%M%SZ)"
              mkdir -p "$RELEASE_BACKUP"
              git rev-parse HEAD > "$RELEASE_BACKUP/commit.txt"
              tar -czf "$RELEASE_BACKUP/release-anterior.tar.gz" \
                backend/src backend/package.json backend/package-lock.json \
                backend/node_modules dashboard/dist .github/workflows/deploy-vps.yml
              cp -p backend/.env "$RELEASE_BACKUP/backend.env"
              chmod 600 "$RELEASE_BACKUP/backend.env" "$RELEASE_BACKUP/release-anterior.tar.gz"
              tar -tzf "$RELEASE_BACKUP/release-anterior.tar.gz" > /dev/null
              sha256sum "$RELEASE_BACKUP/release-anterior.tar.gz"
              log "Backup: $RELEASE_BACKUP"
            fi

            log "Atualizando main"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            log "Commit em deploy"
            git rev-parse --short HEAD

            log "Validando arquivos backend principais"
            cd "$APP_DIR/backend"
            node --check src/app.js
            node --check src/modules/auth/permissions.service.js
            node --check src/modules/media-templates/media-templates.service.js
            node --check src/modules/media-templates/media-templates.routes.js
            node --check src/modules/ai-credentials/ai-credentials.crypto.js
            node --check src/modules/ai-credentials/ai-credentials.service.js
            node --check src/modules/ai-credentials/ai-credentials.routes.js
            node --check src/modules/conversations/instagram-conversations.service.js
            node --check src/modules/conversations/instagram-conversations.routes.js
            node --check src/modules/webhooks/instagram-messages.repository.js
            node --check src/modules/webhooks/instagram-messages.service.js
            node --check src/modules/webhooks/instagram-webhook.signature.js
            node --check src/modules/webhooks/instagram-webhook.verify.js
            node --check src/modules/webhooks/instagram-messages.routes.js
            node --check src/modules/webhooks/instagram-messages.controller.js
            node --check src/modules/privacy/deletion-requests.service.js
            node --check src/modules/privacy/deletion-requests.routes.js
            node --check src/modules/privacy/scope-gate.js
            node --check src/modules/privacy/cache-sweep.js
            node --check src/modules/privacy/deletion-executor.js
            node --check src/modules/privacy/webhook-scope.js
            node --check src/modules/privacy/webhook-redaction.js
            node --check src/lib/db.js
            node --check src/server.js
            node --check src/modules/privacy/restore-guard.js
            node --check src/modules/privacy/restore-replay.js
            node --check src/modules/privacy/backup-inventory.js
            node --check src/modules/instagram/instagram-send.service.js
            node --check src/modules/inbox/testers-dm.service.js
            node --check src/modules/inbox/inbox-images.service.js
            node --check src/modules/inbox/inbox-images.routes.js
            node --check src/modules/inbox/message-send-attempts.js
            node --check src/modules/inbox/instagram-send-message.routes.js
            node --check src/modules/inbox/instagram-send-message.controller.js

            if [[ "$RESTART_BACKEND" == "true" ]]; then
              log "Instalando dependencias backend pelo lockfile"
              npm ci --omit=dev --no-fund
              log "Validando sharp nativo e configuracao privada Inbox"
              node <<'NODE'
            const fs = require('node:fs');
            const dotenv = require('dotenv');
            const sharp = require('sharp');
            const settings = {
              INBOX_PUBLIC_BASE_URL: 'https://api.hrmmotos.com.br',
              INBOX_MEDIA_DIR: '/home/socialbot/storage/inbox',
            };
            const current = dotenv.parse(fs.readFileSync('.env'));
            if (current.PRIVACY_EXECUTOR_ENABLED === 'true' || process.env.PRIVACY_EXECUTOR_ENABLED === 'true') {
              throw new Error('Deploy de validacao exige executor de exclusao desabilitado');
            }
            for (const key of ['META_APP_ID', 'META_APP_SECRET', 'META_WEBHOOK_VERIFY_TOKEN']) {
              if (!current[key]?.trim()) throw new Error(`Configuracao webhook ausente: ${key}`);
            }
            for (const [key, value] of Object.entries(settings)) {
              if (current[key] && current[key] !== value) {
                throw new Error(`Configuracao Inbox divergente: ${key}; revisar antes do deploy`);
              }
            }
            const directory = settings.INBOX_MEDIA_DIR;
            fs.mkdirSync(directory, { recursive: true, mode: 0o700 });
            if (!fs.lstatSync(directory).isDirectory() || fs.realpathSync(directory) !== directory) {
              throw new Error('Armazenamento Inbox deve ser diretorio privado sem symlinks');
            }
            fs.chmodSync(directory, 0o700);
            const additions = Object.entries(settings).filter(([key]) => !current[key]);
            if (additions.length) {
              fs.appendFileSync('.env', '\n' + additions.map(([key, value]) => `${key}=${value}`).join('\n') + '\n');
            }
            fs.chmodSync('.env', 0o600);
            sharp({ create: { width: 1, height: 1, channels: 3, background: '#ffffff' } })
              .png().toBuffer().then(() => console.log('Sharp e armazenamento Inbox OK'))
              .catch(error => { console.error(error.message); process.exitCode = 1; });
            NODE
            fi

            if [[ "$RUN_MIGRATIONS" == "true" ]]; then
              if [[ "$MIGRATION_SET" == "none" ]]; then
                echo "run_migrations=true exige migration_set diferente de none."
                exit 1
              fi

              log "Backup PostgreSQL antes das migrations"
              umask 077
              cd "$APP_DIR"
              BACKUP_DIR="$HOME/backups/socialbot-postgres/deploy-$(date -u +%Y%m%dT%H%M%SZ)"
              export SOCIALBOT_BACKUP_DIR="$BACKUP_DIR"
              export SOCIALBOT_BACKUP_FORMAT=custom
              bash scripts/backup_postgres_db.sh
              BACKUP_FILES=("$BACKUP_DIR"/*.dump)
              [[ "${#BACKUP_FILES[@]}" -eq 1 && -s "${BACKUP_FILES[0]}" ]]
              docker exec -i socialbot_postgres pg_restore --list < "${BACKUP_FILES[0]}" > /dev/null
              sha256sum "${BACKUP_FILES[0]}"

              cd "$APP_DIR/backend"
              case "$MIGRATION_SET" in
                "017")
                  run_migration \
                    "sql/017-privacy-scope-executor.sql" \
                    "sql/017-privacy-scope-executor-verify.sql"
                  ;;
                "016")
                  run_migration \
                    "sql/016-privacy-deletion-requests.sql" \
                    "sql/016-privacy-deletion-requests-verify.sql"
                  ;;
                "015")
                  run_migration \
                    "sql/015-inbox-send-attempts.sql" \
                    "sql/015-inbox-send-attempts-verify.sql"
                  ;;
                "014")
                  run_migration \
                    "sql/014-inbox-unread.sql" \
                    "sql/014-inbox-unread-verify.sql"
                  ;;
                "013")
                  run_migration \
                    "sql/013-testers-dm-visibility.sql" \
                    "sql/013-testers-dm-visibility-verify.sql"
                  ;;
                "009")
                  run_migration \
                    "sql/009-post-title-immediate-queue.sql" \
                    "sql/009-post-title-immediate-queue-verify.sql"
                  ;;
                "010")
                  run_migration \
                    "sql/010-media-templates.sql" \
                    "sql/010-media-templates-verify.sql"
                  ;;
                "011")
                  run_migration \
                    "sql/011-ai-provider-credentials.sql" \
                    "sql/011-ai-provider-credentials-verify.sql"
                  ;;
                "009_010")
                  run_migration \
                    "sql/009-post-title-immediate-queue.sql" \
                    "sql/009-post-title-immediate-queue-verify.sql"
                  run_migration \
                    "sql/010-media-templates.sql" \
                    "sql/010-media-templates-verify.sql"
                  ;;
                "010_011")
                  run_migration \
                    "sql/010-media-templates.sql" \
                    "sql/010-media-templates-verify.sql"
                  run_migration \
                    "sql/011-ai-provider-credentials.sql" \
                    "sql/011-ai-provider-credentials-verify.sql"
                  ;;
                "009_010_011")
                  run_migration \
                    "sql/009-post-title-immediate-queue.sql" \
                    "sql/009-post-title-immediate-queue-verify.sql"
                  run_migration \
                    "sql/010-media-templates.sql" \
                    "sql/010-media-templates-verify.sql"
                  run_migration \
                    "sql/011-ai-provider-credentials.sql" \
                    "sql/011-ai-provider-credentials-verify.sql"
                  ;;
                *)
                  echo "migration_set invalido: $MIGRATION_SET"
                  exit 1
                  ;;
              esac
            else
              log "Migrations desativadas"
            fi

            if [[ "$RESTART_BACKEND" == "true" || "$DEPLOY_DASHBOARD" == "true" ]]; then
              log "Verificando schema obrigatorio do Inbox antes de publicar"
              cd "$APP_DIR/backend"
              docker exec -i socialbot_postgres psql -U n8n -d n8n \
                < sql/014-inbox-unread-verify.sql
              docker exec -i socialbot_postgres psql -U n8n -d n8n \
                < sql/015-inbox-send-attempts-verify.sql
              docker exec -i socialbot_postgres psql -U n8n -d n8n \
                < sql/016-privacy-deletion-requests-verify.sql
              docker exec -i socialbot_postgres psql -U n8n -d n8n \
                < sql/017-privacy-scope-executor-verify.sql
            fi

            if [[ "$RESTART_BACKEND" == "true" ]]; then
              log "Reiniciando backend PM2"
              pm2 restart socialbot-backend
              pm2 save
            else
              log "Restart backend desativado"
            fi

            if [[ "$DEPLOY_DASHBOARD" == "true" ]]; then
              log "Publicando dashboard"
              cd "$APP_DIR/scripts"
              ./deploy_frontend_hostinger.sh
            else
              log "Deploy dashboard desativado"
            fi

            log "Health check API"
            curl --retry 12 --retry-delay 5 --retry-connrefused \
              --connect-timeout 10 --max-time 15 -fsS \
              https://api.hrmmotos.com.br/api/health

            log "Deploy finalizado"
